name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium

      - run: npm run test:emulators

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          cp -R public _site
          find _site -name "*.d.ts" -delete
          touch _site/.nojekyll

      - name: Write Firebase config from repository variables
        if: ${{ vars.FIREBASE_CONFIG != '' }}
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY }}
        run: |
          printf 'export const firebaseConfig = %s;\n\nexport const appCheckSiteKey = "%s";\n' \
            "$FIREBASE_CONFIG" "$APP_CHECK_SITE_KEY" > _site/firebase-config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
